apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobtracker-api-ingress
  namespace: jobtracker
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: jobtracker.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobtracker-frontend-ingress
  namespace: jobtracker
spec:
  ingressClassName: nginx
  rules:
    - host: jobtracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
